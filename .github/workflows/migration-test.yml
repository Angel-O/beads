name: Migration Test Harness

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'website/**'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versions:
        description: 'Specific versions to test (space-separated), or empty for all eras'
        required: false
        default: ''
      mode:
        description: 'Test mode'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - direct-only
          - stepping-only

permissions:
  contents: read

env:
  BD_DISABLE_METRICS: "1"
  BD_DISABLE_EVENT_FLUSH: "1"

jobs:
  historical-upgrades:
    name: ${{ matrix.qualification }} upgrade qualification
    if: ${{ github.event_name == 'pull_request' }}
    # v0.55.4 is dynamically linked against the ICU version shipped here.
    # Pin the image so a runner alias update cannot invalidate the fixture.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - qualification: SQLite v0.49.6
            version: v0.49.6
            expected: MANUAL
            cache-identity: sqlite-v0.49.6-8546dc9a47e11dc31ac2bc9a0224a9c690975e91850932cbb62623053fbb7db8
          - qualification: Legacy Dolt-dir v0.55.4
            version: v0.55.4
            expected: MANUAL
            cache-identity: legacy-dolt-v0.55.4-e0fa25456dd82890230eef17653448a0bf995104c78864be91c5ed84426a5f49
          - qualification: Legacy Dolt-dir v0.57.0
            version: v0.57.0
            expected: MANUAL
            cache-identity: legacy-dolt-v0.57.0-f8629d5627bed7d25f06f92334addc171d679f9aed9d08c5d42a9684205dc04b
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3

      - name: Install pinned Dolt runtime for v0.57.0
        if: matrix.version == 'v0.57.0'
        env:
          HISTORICAL_VERSION: ${{ matrix.version }}
        run: |
          source scripts/migration-test/lib/versions.sh
          DOLT_VERSION=$(strict_required_dolt_version "$HISTORICAL_VERSION")
          DOLT_SHA256=$(strict_required_dolt_sha256 "$HISTORICAL_VERSION" linux amd64)
          archive="$RUNNER_TEMP/dolt-linux-amd64.tar.gz"
          extract_dir="$RUNNER_TEMP/dolt-${DOLT_VERSION}"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/dolthub/dolt/releases/download/v${DOLT_VERSION}/dolt-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$DOLT_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir"
          dolt_bin=$(find "$extract_dir" -type f -path '*/bin/dolt' -print -quit)
          test -n "$dolt_bin"
          sudo install -m 0755 "$dolt_bin" /usr/local/bin/dolt
          test "$(dolt version | head -1)" = "dolt version ${DOLT_VERSION}"

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@beads.test"

      - name: Cache pinned historical release
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/beads-regression
          key: migration-${{ matrix.cache-identity }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build candidate
        run: make build

      - name: Verify strict harness guards
        run: ./scripts/migration-test/strict-mode-test.sh

      - name: Qualify ${{ matrix.qualification }} upgrade
        env:
          CANDIDATE_BIN: ./bd
          GIT_CONFIG_NOSYSTEM: "1"
          EXPECTED_STATUS: ${{ matrix.expected }}
          HISTORICAL_VERSION: ${{ matrix.version }}
        run: ./scripts/migration-test/run.sh --strict --expect "$EXPECTED_STATUS" "$HISTORICAL_VERSION"

  migration-test:
    name: Migration fidelity
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3

      - name: Install Dolt
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/install.sh | sudo bash
          dolt version

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@beads.test"

      - name: Cache old binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/beads-regression
          key: migration-test-${{ runner.os }}-${{ runner.arch }}

      - name: Build candidate
        run: go build -tags gms_pure_go -o bd ./cmd/bd

      - name: Run migration test harness
        env:
          CANDIDATE_BIN: ./bd
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.mode }}" = "direct-only" ]; then
            ARGS="--direct-only"
          elif [ "${{ github.event.inputs.mode }}" = "stepping-only" ]; then
            ARGS="--stepping-only"
          fi
          if [ -n "${{ github.event.inputs.versions }}" ]; then
            ./scripts/migration-test/run.sh ${{ github.event.inputs.versions }}
          else
            ./scripts/migration-test/run.sh $ARGS
          fi
